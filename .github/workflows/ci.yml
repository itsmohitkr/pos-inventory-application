name: CI

# Kept so main's branch protection (required check "lint-and-test") still works. It only confirms that this
# repository holds nothing but this README and this workflow: releases are published here from the private
# development repository, never built here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Only the releases README and this workflow are tracked
        run: |
          set -euo pipefail
          unexpected=$(git ls-files | grep -vxE 'README\.md|\.github/workflows/ci\.yml' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::This repository only hosts releases. Unexpected files:"; echo "$unexpected"; exit 1
          fi
          echo "OK"
