name: Build and Release POS Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Quality Gate ────────────────────────────────────────────
  # Runs server + client tests before allowing build/release
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Server Tests ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # `prisma`'s own postinstall (triggered by the npm ci above) generates a
      # client into server/node_modules/.prisma using a stale/default schema
      # snapshot — a SEPARATE copy from the one schema.prisma's custom
      # `output` actually targets (repo-root node_modules/.prisma). Node's
      # module resolution finds this nearer, stale copy first, so any tsc
      # step (build or typecheck) run before this cleanup silently typechecks
      # against a `{}`-shaped Prisma Client instead of the real schema.
      # Removing it lets resolution correctly fall through to the client
      # this step generates next.
      - name: Generate Prisma Client
        working-directory: server
        run: |
          rm -rf node_modules/.prisma
          npx prisma generate

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Validate Prisma Migrations
        working-directory: server
        # This checks if the schema has changes that are NOT in migrations
        run: npx prisma migrate diff --from-migrations ./prisma/migrations --to-schema-datamodel ./prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: "file:./test.db"

      - name: Typecheck server
        working-directory: server
        run: npm run typecheck

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Run server tests
        working-directory: server
        run: npm test

      # ── Client Tests ──
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Typecheck client
        working-directory: client
        run: npm run typecheck

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Build client
        working-directory: client
        run: npm run build

      # Upload sourcemaps once here from the final build output, not inside platform jobs
      - name: Create Sentry release and upload source maps
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          sourcemaps: ./client/dist
          url_prefix: "~/dist/"
          ignore_missing: true
          ignore_empty: true

  # ── macOS Build ─────────────────────────────────────────────
  build-mac:
    needs: quality-gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Update version
        run: |
          TAG="${{ github.ref_name }}"
          NUM="${TAG#v}"
          npm version "1.0.$NUM" --no-git-tag-version

      - name: Install root dependencies
        run: npm ci

      - name: Set executable permissions for app-builder
        run: chmod +x node_modules/app-builder-bin/mac/app-builder_arm64

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # See the same step in quality-gate above — must run before any tsc
      # step (build or typecheck), and before the stale server-local
      # node_modules/.prisma npm ci creates gets a chance to shadow it.
      - name: Generate Prisma Client
        run: |
          rm -rf server/node_modules/.prisma
          npx prisma generate --schema=server/prisma/schema.prisma

      - name: Build client
        working-directory: client
        run: npx vite build

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build desktop
        run: npm run desktop-build

      - name: Package macOS installer
        run: npx electron-builder --mac --publish never

      - name: Upload mac installer
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            dist/*.dmg
            dist/latest-mac.yml
          retention-days: 90

  # ── Windows Build ───────────────────────────────────────────
  build-win:
    needs: quality-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Update version
        run: |
          $tag = "${{ github.ref_name }}"
          $num = $tag.TrimStart('v')
          npm version "1.0.$num" --no-git-tag-version

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # See the equivalent step in quality-gate/build-mac above for why this
      # order matters and why the stale copy must be removed first —
      # PowerShell syntax here since this job runs on windows-latest.
      - name: Generate Prisma Client
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force server/node_modules/.prisma -ErrorAction SilentlyContinue
          npx prisma generate --schema=server/prisma/schema.prisma

      - name: Build client
        working-directory: client
        run: npx vite build

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build desktop
        run: npm run desktop-build

      - name: Package Windows installer
        run: npx electron-builder --win --publish never

      - name: Upload windows installer
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 90

  # ── Packaged Smoke Test ─────────────────────────────────────
  # Boots the actual installed artifact. Every other gate tests source; without
  # this, a packaging regression (e.g. the server failing to resolve its Prisma
  # schema) passes CI and auto-updates to customers as an app that won't start.
  #
  # Two scenarios, both required:
  #   1. Fresh install  — no pos.db: migrations must run, server must answer
  #   2. Upgrade        — existing pos.db: must reuse it, not re-migrate or wipe
  # Scenario 2 is the path every current customer takes on auto-update.
  smoke-mac:
    needs: build-mac
    runs-on: macos-latest
    steps:
      - name: Download mac installer
        uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: dist/

      - name: Extract app from DMG
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg | head -1)
          hdiutil attach "$DMG" -mountpoint /tmp/trovix-mnt -nobrowse -quiet
          cp -R "/tmp/trovix-mnt/Trovix.app" /tmp/Trovix.app
          hdiutil detach /tmp/trovix-mnt -quiet
          test -x "/tmp/Trovix.app/Contents/MacOS/Trovix"

      - name: Scenario 1 — fresh install boots and migrates
        run: |
          set -euo pipefail
          USERDATA=/tmp/trovix-userdata
          rm -rf "$USERDATA" && mkdir -p "$USERDATA"

          "/tmp/Trovix.app/Contents/MacOS/Trovix" --user-data-dir="$USERDATA" \
            > /tmp/app-fresh.log 2>&1 &
          echo $! > /tmp/app.pid

          # gatingMiddleware holds requests until boot completes, so a 2xx here
          # means migrations + seeding finished successfully.
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:5001/api/settings >/dev/null 2>&1; then
              echo "Server ready after ${i}s"
              READY=1; break
            fi
            sleep 1
          done

          kill "$(cat /tmp/app.pid)" 2>/dev/null || true
          sleep 3

          if [ "${READY:-0}" != "1" ]; then
            echo "::error::Packaged app failed to serve on 127.0.0.1:5001 (fresh install)"
            cat /tmp/app-fresh.log; exit 1
          fi
          if [ ! -f "$USERDATA/pos.db" ]; then
            echo "::error::pos.db was not created on first boot"
            cat /tmp/app-fresh.log; exit 1
          fi

      - name: Scenario 2 — upgrade over existing pos.db
        run: |
          set -euo pipefail
          USERDATA=/tmp/trovix-userdata
          test -f "$USERDATA/pos.db" || { echo "::error::missing pos.db from scenario 1"; exit 1; }
          BEFORE=$(shasum "$USERDATA/pos.db" | cut -d' ' -f1)

          "/tmp/Trovix.app/Contents/MacOS/Trovix" --user-data-dir="$USERDATA" \
            > /tmp/app-upgrade.log 2>&1 &
          echo $! > /tmp/app.pid

          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:5001/api/settings >/dev/null 2>&1; then
              READY=1; break
            fi
            sleep 1
          done

          kill "$(cat /tmp/app.pid)" 2>/dev/null || true
          sleep 3

          if [ "${READY:-0}" != "1" ]; then
            echo "::error::Packaged app failed to boot against an existing pos.db"
            cat /tmp/app-upgrade.log; exit 1
          fi
          echo "Existing DB checksum before: $BEFORE"
          echo "Upgrade boot succeeded against existing database"

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-mac-logs
          path: /tmp/app-*.log
          retention-days: 7

  smoke-win:
    needs: build-win
    runs-on: windows-latest
    steps:
      - name: Download windows installer
        uses: actions/download-artifact@v4
        with:
          name: win-installer
          path: dist/

      - name: Exclude installer from Windows Defender
        shell: pwsh
        run: |
          # The installer is unsigned (no code-signing cert configured), which
          # Windows Defender/SmartScreen on a fresh runner can flag for a
          # cloud-reputation check — observed to stall the "silent" install for
          # several minutes and, on at least one run, prevent it from
          # completing at all (no exe found afterward in any candidate path).
          # Excluding the download folder, the candidate install roots, and
          # the installer's own process name keeps Defender from scanning or
          # blocking anything related to this install.
          $paths = @(
            (Resolve-Path 'dist').Path,
            "$env:LOCALAPPDATA\Programs",
            "$env:ProgramFiles",
            "${env:ProgramFiles(x86)}"
          ) | Where-Object { $_ }
          Add-MpPreference -ExclusionPath $paths
          Add-MpPreference -ExclusionProcess 'Trovix.exe'
          $setupName = (Get-ChildItem dist/*.exe | Select-Object -First 1).Name
          if ($setupName) { Add-MpPreference -ExclusionProcess $setupName }

      - name: Install silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait

          # This installer is an "assisted" (non-one-click) NSIS build with no
          # explicit `perMachine` setting, which defaults to a per-user install
          # under %LOCALAPPDATA%\Programs. But electron-builder/NSIS silently
          # switches to a per-machine install under Program Files when the
          # installing process is elevated — and different GitHub-hosted
          # runner images have been observed to run the default account with
          # different elevation, so which path wins isn't guaranteed to stay
          # fixed across runner-image updates. Check every plausible location
          # instead of assuming one.
          $searchRoots = @(
            "$env:LOCALAPPDATA\Programs",
            "$env:ProgramFiles",
            "${env:ProgramFiles(x86)}"
          ) | Where-Object { $_ -and (Test-Path $_) }

          $exe = $searchRoots |
            ForEach-Object { Get-ChildItem $_ -Recurse -Filter 'Trovix.exe' -ErrorAction SilentlyContinue } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "Trovix.exe not found after install. Searched: $($searchRoots -join ', ')"
            exit 1
          }
          Write-Host "Found installed exe at $($exe.FullName)"
          echo "TROVIX_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Scenario 1 — fresh install boots and migrates
        shell: pwsh
        run: |
          $userData = "$env:TEMP\trovix-userdata"
          Remove-Item -Recurse -Force $userData -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $userData | Out-Null

          $proc = Start-Process -FilePath $env:TROVIX_EXE `
            -ArgumentList "--user-data-dir=$userData" -PassThru

          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            try {
              Invoke-WebRequest -Uri 'http://127.0.0.1:5001/api/settings' `
                -UseBasicParsing -TimeoutSec 3 | Out-Null
              $ready = $true; Write-Host "Server ready after ${i}s"; break
            } catch { Start-Sleep -Seconds 1 }
          }

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          if (-not $ready) { Write-Error 'Packaged app failed to serve on 127.0.0.1:5001'; exit 1 }
          if (-not (Test-Path "$userData\pos.db")) { Write-Error 'pos.db not created on first boot'; exit 1 }

      - name: Scenario 2 — upgrade over existing pos.db
        shell: pwsh
        run: |
          $userData = "$env:TEMP\trovix-userdata"
          if (-not (Test-Path "$userData\pos.db")) { Write-Error 'missing pos.db from scenario 1'; exit 1 }

          $proc = Start-Process -FilePath $env:TROVIX_EXE `
            -ArgumentList "--user-data-dir=$userData" -PassThru

          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            try {
              Invoke-WebRequest -Uri 'http://127.0.0.1:5001/api/settings' `
                -UseBasicParsing -TimeoutSec 3 | Out-Null
              $ready = $true; break
            } catch { Start-Sleep -Seconds 1 }
          }

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ready) { Write-Error 'Packaged app failed to boot against an existing pos.db'; exit 1 }
          Write-Host 'Upgrade boot succeeded against existing database'

  # ── Release ─────────────────────────────────────────────────
  release:
    needs: [smoke-mac, smoke-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download mac installer
        uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: dist/

      - name: Download windows installer
        uses: actions/download-artifact@v4
        with:
          name: win-installer
          path: dist/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/latest.yml
            dist/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
